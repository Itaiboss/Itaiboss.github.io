<header class="site-header">
  <div class="site-controls">
    <button data-mode-toggle title="Toggle light/dark theme" aria-label="Toggle light/dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="12" y1="2" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22"></line>
        <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
        <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
        <line x1="2" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="22" y2="12"></line>
        <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
        <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <button data-boring-toggle title="I'm boring">boring</button>
    {% if site.goat_counter %}
      <span class="hit-counter" data-goatcounter-site="{{ site.goat_counter }}">
        visits: <span class="hit-counter-value">···</span>
      </span>
    {% endif %}
  </div>

  <div class="site-identity">
    <div class="site-emblem">
      <div class="emblem-ring"></div>
      <div class="emblem-core"></div>
    </div>

    <div class="site-title">{{ site.title }}</div>
  </div>

  <nav class="site-nav">
    {% for item in site.data.menu.entries %}
      <a href="{{ item.url | relative_url }}"
         class="{% if page.url == item.url %}active{% endif %}">
        {{ item.title }}
      </a>
    {% endfor %}
  </nav>
</header>
