<header class="site-header">
  <div class="site-title"><a href="{{ "/" | relative_url }}">{{ site.title }}</a></div>

  <nav class="site-nav">
    {% for item in site.data.menu.entries %}
      <a href="{{ item.url | relative_url }}"
         class="{% if page.url == item.url %}active{% endif %}">{{ item.title }}</a>{% unless forloop.last %} | {% endunless %}
    {% endfor %}
  </nav>

  {% if site.goat_counter %}
    <p class="hit-counter" data-goatcounter-site="{{ site.goat_counter }}">
      Visitors: <span class="hit-counter-value">···</span>
    </p>
  {% endif %}
</header>
