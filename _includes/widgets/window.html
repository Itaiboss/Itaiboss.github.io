{% comment %}
Usage: {% include widgets/window.html title="About Me" class="terminal" content=my_content %}
Or wrap a block using capture in the calling template.
{% endcomment %}
<div class="win-window {{ include.class }}">
  <div class="win-titlebar">
    <span class="win-title">{{ include.title }}</span>
  </div>
  <div class="win-body">
    {{ include.content | markdownify }}
  </div>
</div>
